resources:
  jobs:
    openbanking_banking_daily:
      name: openbanking-banking-daily

      email_notifications:
        on_failure:
          - admin@graxiano.com

      schedule:
        quartz_cron_expression: "0 0 0 * * ?"
        timezone_id: Europe/Madrid
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      tasks:
        - task_key: ingest_banking
          notebook_task:
            notebook_path: ../notebooks/02_ingest_banking.py.ipynb
            source: WORKSPACE
          max_retries: 0

      queue:
        enabled: true

      performance_target: PERFORMANCE_OPTIMIZED